[workspace]
members = ["crates/generals-assets", "crates/generals-sim", "crates/generals-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license-file = "LICENSE.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
strip = "debuginfo"
